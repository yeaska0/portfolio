<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — ItYerasyl0.dev</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@700;900&display=swap" rel="stylesheet">
    <style>
        [data-theme="dark"]{--bg:#04060a;--a1:#22d3ee;--a2:#a78bfa;--text:#dde8f0;--muted:#3d5a72}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
        .num{font-size:clamp(100px,20vw,200px);font-weight:900;line-height:1;background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .msg{font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--muted);letter-spacing:2px;margin:16px 0 40px}
        a{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#04060a;font-weight:700;border-radius:10px;text-decoration:none;font-size:14px;transition:transform .2s,box-shadow .2s}
        a:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(34,211,238,.3)}
    </style>
</head>
<body>
<div>
    <div class="num">404</div>
    <div class="msg">PAGE NOT FOUND</div>
    <a href="/">← Back to Home</a>
</div>
</body>
</html>
